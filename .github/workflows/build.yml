name: build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (macOS app bundle)
        if: runner.os == 'macOS'
        run: ./build_macos.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: CatTetris-macos
          path: dist/CatTetris-macos.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: CatTetris-windows
          path: target/release/tetris.exe
